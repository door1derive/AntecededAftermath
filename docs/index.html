<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Facility Preview - OBJ Viewer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { margin: 0; overflow: hidden; font-family: sans-serif; }
    #overlay { position: absolute; left: 10px; top: 10px; z-index: 10; background: rgba(255,255,255,0.8); padding: 8px; border-radius: 4px; }
    #canvas { width: 100vw; height: 100vh; display: block; }
    a { color: #07c; }
  </style>
</head>
<body>
<div id="overlay">
  <div><strong>Facility OBJ Preview</strong></div>
  <div style="margin-top:6px">Model: <span id="modelName">sample_floor.obj</span></div>
  <div style="margin-top:6px">
    <input type="file" id="fileInput" accept=".obj" />
    <button id="resetBtn">Reset</button>
  </div>
  <div style="margin-top:6px; font-size:12px">Drag to orbit, scroll to zoom.</div>
</div>
<canvas id="canvas"></canvas>

<!-- Three.js and helpers (non-module builds) -->
<script src="https://unpkg.com/three@0.152.2/build/three.min.js"></script>
<script src="https://unpkg.com/three@0.152.2/examples/js/controls/OrbitControls.js"></script>
<script src="https://unpkg.com/three@0.152.2/examples/js/loaders/OBJLoader.js"></script>

<script>
(function(){
  const canvas = document.getElementById('canvas');
  const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.setSize(window.innerWidth, window.innerHeight);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x222233);

  const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.set(0, -5, 6);

  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.target.set(0,0,0);
  controls.update();

  // lights
  const hemi = new THREE.HemisphereLight(0xffffff, 0x444444, 0.8);
  hemi.position.set(0, 1, 0);
  scene.add(hemi);
  const dir = new THREE.DirectionalLight(0xffffff, 0.8);
  dir.position.set(-5, 10, 10);
  scene.add(dir);

  let modelGroup = new THREE.Group();
  scene.add(modelGroup);

  function centerAndScale(object) {
    const box = new THREE.Box3().setFromObject(object);
    const size = new THREE.Vector3();
    box.getSize(size);
    const center = new THREE.Vector3();
    box.getCenter(center);
    if (size.length() === 0) return;
    const maxSide = Math.max(size.x, size.y, size.z);
    const scale = 4.0 / maxSide;
    object.scale.setScalar(scale);
    object.position.sub(center.multiplyScalar(scale));
  }

  function loadOBJFromURL(url, name) {
    document.getElementById('modelName').textContent = name || url.split('/').pop();
    const loader = new THREE.OBJLoader();
    loader.load(url, (obj) => {
      modelGroup.clear();
      modelGroup.add(obj);
      centerAndScale(obj);
    }, undefined, (err) => {
      console.error('OBJ load error', err);
      alert('Failed to load OBJ: ' + err.message);
    });
  }

  function loadOBJFromText(text, name) {
    const loader = new THREE.OBJLoader();
    const obj = loader.parse(text);
    modelGroup.clear();
    modelGroup.add(obj);
    centerAndScale(obj);
    document.getElementById('modelName').textContent = name || 'uploaded.obj';
  }

  // Initial sample model in repo
  loadOBJFromURL('models/sample_floor.obj', 'sample_floor.obj');

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  function animate() {
    requestAnimationFrame(animate);
    renderer.render(scene, camera);
  }
  animate();

  // file input
  const fileInput = document.getElementById('fileInput');
  fileInput.addEventListener('change', (ev) => {
    const file = ev.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(e) {
      loadOBJFromText(e.target.result, file.name);
    };
    reader.readAsText(file);
  });

  document.getElementById('resetBtn').addEventListener('click', () => {
    loadOBJFromURL('models/sample_floor.obj', 'sample_floor.obj');
  });
})();
</script>
</body>
</html>
